name: Ruby tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install dependencies
        run: bundle install
      - name: Run RSpec
        run: bundle exec rspec
